[project]
name = "sample-agentframework-agent"
version = "0.1.0"
description = "Sample Agent Framework Agent using Microsoft Agent 365 SDK"
authors = [
    { name = "Microsoft", email = "support@microsoft.com" }
]
dependencies = [
    # AgentFramework SDK - latest pre-release
    "agent-framework-core>=1.0.1",
    "agent-framework-openai>=1.0.1",
    "agent-framework-azure-ai>=1.0.0rc6",

    # Azure AI
    "azure-ai-agents>=1.2.0b5",
    "azure-ai-projects>=2.0.1",

    # Microsoft Agents SDK
    "microsoft-agents-hosting-aiohttp>=0.5.3",
    "microsoft-agents-hosting-core>=0.5.3",
    "microsoft-agents-authentication-msal>=0.5.3",
    "microsoft-agents-activity>=0.5.3",

    # Azure SDK
    "azure-identity>=1.25.0",

    # Core dependencies
    "python-dotenv>=1.0.0",
    "aiohttp>=3.7.0",

    # HTTP server
    "uvicorn[standard]>=0.20.0",
    "fastapi>=0.100.0",

    # HTTP client
    "httpx>=0.28.0",

    # MCP support
    "mcp>=1.27.0",

    # Data validation
    "pydantic>=2.0.0",

    # Utilities
    "typing-extensions>=4.0.0",

    # Microsoft Agent 365 SDK packages - latest pre-release
    "microsoft-agents-a365-tooling>=0.2.1.dev48",
    "microsoft-agents-a365-tooling-extensions-agentframework>=0.2.1.dev48",
    "microsoft-agents-a365-observability-core>=0.2.1.dev48",
    "microsoft-agents-a365-observability-extensions-agent-framework>=0.2.1.dev48",
    "microsoft-agents-a365-runtime>=0.2.1.dev48",
    "microsoft-agents-a365-notifications>=0.2.1.dev48",
]
requires-python = ">=3.11"

# Package index configuration
# PyPI is the default/primary source, local packages are fallback
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# Allow pre-release versions for Microsoft Agent 365 SDK packages
# This ensures we always get the latest features and fixes
[tool.uv]
prerelease = "allow"
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
